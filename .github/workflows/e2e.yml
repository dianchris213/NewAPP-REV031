name: E2E

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and typecheck
        run: |
          bun run lint
          bunx tsc --noEmit

      - name: Unit tests
        run: bunx vitest run

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: E2E tests
        run: bunx playwright test

      # Traces, screenshots and videos are produced on failure (see
      # playwright.config.ts) and uploaded unconditionally so evidence for a
      # failing run is always available in the workflow summary.
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
            e2e/__screenshots__/
          if-no-files-found: ignore
          retention-days: 14
